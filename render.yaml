# Render Blueprint: the whole app (API + PostgreSQL + frontend) as code.
# Alternative to the AWS deployment in infra/.
#
# Values marked `sync: false` are asked for in the Render dashboard when the
# Blueprint is created. They never live in the repository.

databases:
  - name: checkout-onboarding-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: checkout
    user: checkout
    # Empty list = no external connections; only services on Render's
    # private network (the API) can reach the database.
    ipAllowList: []

services:
  # ---- API (NestJS, same Dockerfile as the AWS deployment) ----
  - type: web
    name: checkout-onboarding-api
    runtime: docker
    # Starter: always on (the free plan sleeps after 15 min without traffic).
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: checkout-onboarding-db
          property: connectionString
      # Private network connection inside Render.
      - key: DB_SSL
        value: "false"
      # The container runs migrations + seed before starting (see Dockerfile).
      - key: DB_RUN_MIGRATIONS
        value: "false"
      # Frontend URL, e.g. https://checkout-onboarding-web.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: BASE_FEE_IN_CENTS
        value: "300000"
      - key: DELIVERY_FEE_IN_CENTS
        value: "1000000"
      # Payment gateway sandbox: values from backend/.env.
      - key: PAYMENT_API_URL
        sync: false
      - key: PAYMENT_PUBLIC_KEY
        sync: false
      - key: PAYMENT_PRIVATE_KEY
        sync: false
      - key: PAYMENT_INTEGRITY_SECRET
        sync: false
      - key: PAYMENT_EVENTS_SECRET
        sync: false

  # ---- Frontend (React SPA, static files on Render's CDN) ----
  - type: web
    name: checkout-onboarding-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Only our own scripts, styles and images run on the page. connect-src
      # allows HTTPS calls: the API and the payment gateway (card tokenization).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      # The app needs no device features: turn them all off.
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Product images keep their names: cache for a day.
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400
    envVars:
      # API URL, e.g. https://checkout-onboarding-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
      # PUBLIC values only: they end up in the browser bundle.
      - key: VITE_PAYMENT_API_URL
        sync: false
      - key: VITE_PAYMENT_PUBLIC_KEY
        sync: false
