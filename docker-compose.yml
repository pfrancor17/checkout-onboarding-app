services:
  postgres:
    image: postgres:16-alpine
    container_name: checkout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-checkout}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-checkout}
      POSTGRES_DB: ${DB_NAME:-checkout}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-checkout} -d ${DB_NAME:-checkout}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
