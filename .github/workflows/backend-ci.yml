name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint:check
      - name: Unit tests with coverage (threshold 80%)
        run: npm run test:cov
      - name: E2E tests
        run: npm run test:e2e
      - run: npm run build

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% |`;
              console.log(["### Backend coverage", "| Metric | % |", "|---|---|",
                row("statements"), row("branches"), row("functions"), row("lines")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

  database:
    name: Migrations & seed (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: checkout
          POSTGRES_DB: checkout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U checkout -d checkout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: checkout
      DB_PASSWORD: checkout
      DB_NAME: checkout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Run migrations and seed
        run: npm run db:setup
      - name: Seed is idempotent
        run: npm run seed | grep "0 new product(s)"
      - name: Migrations can be reverted
        run: npm run migration:revert
